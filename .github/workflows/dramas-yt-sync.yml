# NEXORA FIX (2026-10-31): reconstruido sobre la interfaz REAL de sync-dramas-yt.py
# (auditada: --workers, --max-series, TMDB_API_KEY; escribe public/data/catalog-dramasyt.json
# + índice lite + details + state). Cambios: yt-dlp/Pillow en requirements, paso de índice
# canónico build-index.mjs, y git add -A (el pathspec explícito fallaba cuando el sync no
# generaba fichero). Ajusta el cron al que tuvieras antes.
name: dramas-yt sync

on:
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:

env:
  DYT_MAX: 0

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Sync catálogo DramasYT (YouTube oficial)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python sync-dramas-yt.py --workers 6 --max-series "$DYT_MAX"

      - name: Índice canónico NEXORA
        run: node scripts/build-index.mjs

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A public/data/ import/state.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Sync DramasYT [skip ci]"
            git push
          fi
